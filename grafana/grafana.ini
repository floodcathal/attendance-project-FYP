[server]
root_url = $__env{GRAFANA_ROOT_URL}

[auth.generic_oauth]
enabled = true
name = TU Dublin SSO
allow_sign_up = true
auto_login = false
client_id = $__env{AZURE_CLIENT_ID}
client_secret = $__env{AZURE_CLIENT_SECRET}
scopes = openid email profile
auth_url = https://login.microsoftonline.com/$__env{AZURE_TENANT_ID}/oauth2/v2.0/authorize
token_url = https://login.microsoftonline.com/$__env{AZURE_TENANT_ID}/oauth2/v2.0/token
api_url = https://graph.microsoft.com/v1.0/me
allowed_domains = $__env{AZURE_ALLOWED_DOMAINS}
allow_assign_grafana_admin = false
role_attribute_path = contains(email, 'admin') && 'Admin' || contains(email, 'lecturer') && 'Editor' || 'Viewer'

[log]
level = debug