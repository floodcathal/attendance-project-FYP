<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU Dublin Attendance Check-In</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #ffffff, #ffffff); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; color: rgb(0, 0, 0); margin-bottom: 20px; }
        .card { background: rgb(0, 0, 0); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #reader { margin-bottom: 20px; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .room-display { background: #f0f4ff; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 2px solid #ddd; font-size: 16px; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .action-btn { padding: 12px; font-weight: bold; border-radius: 6px; border: 2px solid #ddd; background: white; cursor: pointer; }
        .action-btn.selected { background: #00ff0d; color: white; border-color: #ffffff; }
        .submit-btn { width: 100%; padding: 14px; background: #d4e211; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; }
        .status-message { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; display: none; }
        .status-message.success { background: #d4edda; color: #155724; display: block; }
        .status-message.error { background: #f8d7da; color: #721c24; display: block; }
        
        /* Device ID Display */
        .device-info { 
            position: fixed; 
            bottom: 10px; 
            right: 10px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 10px; 
            border-radius: 5px; 
            font-size: 12px;
            max-width: 200px;
            word-wrap: break-word;
        }
        .device-info strong { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>TU Dublin Attendance</h2>
        <p>Scan Room QR Code</p>
    </div>

    <div class="card">
        <div id="reader"></div>

        <div id="form-section" class="form-section">
            <div class="room-display">
                <strong>Room:</strong> <span id="room"></span><br>
                <strong>Building:</strong> <span id="building"></span> |
                <strong>Floor:</strong> <span id="floor"></span>
            </div>

            <label>Student ID</label>
            <input id="studentId" placeholder="C22312211">

            <label>Action</label>
            <div class="action-buttons">
                <button class="action-btn" id="inBtn">Check In</button>
                <button class="action-btn" id="outBtn">Check Out</button>
            </div>

            <button class="submit-btn" onclick="submitAttendance()">Submit</button>
        </div>

        <div id="status" class="status-message"></div>
    </div>
</div>

<!-- Device ID Display -->
<div class="device-info">
    <strong>Device ID:</strong>
    <span id="deviceIdDisplay">Loading...</span>
</div>

<script>
// ============================================================================
// CONFIGURATION
// ============================================================================
const NODE_RED_URL = '/attendance/submit';

// ============================================================================
// DEVICE TRACKING - UUID v4 GENERATION
// ============================================================================

/**
 * Generate or retrieve unique device ID
 * Uses UUID v4 format, stored in localStorage
 */
function getDeviceId() {
    let deviceId = localStorage.getItem('deviceId');
    
    if (!deviceId) {
        // Generate new UUID v4
        deviceId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0;
            const v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
        
        localStorage.setItem('deviceId', deviceId);
        console.log('🆕 New device ID generated:', deviceId);
    } else {
        console.log('✓ Existing device ID:', deviceId);
    }
    
    return deviceId;
}

/**
 * Collect device metadata for fraud detection
 */
function getDeviceMetadata() {
    return {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        screenResolution: `${screen.width}x${screen.height}`,
        colorDepth: screen.colorDepth,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        online: navigator.onLine,
        cookiesEnabled: navigator.cookieEnabled
    };
}

/**
 * Display device ID on screen (first 8 chars + ...)
 */
function displayDeviceId() {
    const deviceId = getDeviceId();
    const shortId = deviceId.substring(0, 8) + '...';
    document.getElementById('deviceIdDisplay').textContent = shortId;
}

// ============================================================================
// QR CODE SCANNER
// ============================================================================

let scannedRoom = null;
let selectedAction = null;
let qr = null;

/** Building + floor from room id (TN001→floor 0, TN101→1, TN202→2). Strips hyphens. */
function parseBuildingFloorFromRoomId(roomId) {
    const normalized = String(roomId).replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    const m = normalized.match(/^([A-Z]+)(\d+)$/);
    if (!m) return { building: 'Unknown', floor: 'Unknown' };
    const digits = m[2];
    return { building: m[1], floor: digits.length >= 1 ? digits[0] : 'Unknown' };
}

function startScanner() {
    qr = new Html5Qrcode("reader");
    qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
    );
}

function onScanSuccess(text) {
    try {
        scannedRoom = JSON.parse(text);
    } catch {
        showStatus("Invalid QR Code", "error");
        return;
    }

    qr.stop();

    const meta = parseBuildingFloorFromRoomId(scannedRoom.roomId);
    scannedRoom.building = meta.building;
    scannedRoom.floor = meta.floor;

    document.getElementById("room").textContent = scannedRoom.roomId;
    document.getElementById("building").textContent = scannedRoom.building;
    document.getElementById("floor").textContent = scannedRoom.floor;

    document.getElementById("reader").style.display = "none";
    document.getElementById("form-section").classList.add("active");
}

// ============================================================================
// ACTION SELECTION
// ============================================================================

document.getElementById("inBtn").onclick = () => selectAction("check-in");
document.getElementById("outBtn").onclick = () => selectAction("check-out");

function selectAction(action) {
    selectedAction = action;
    document.getElementById("inBtn").classList.toggle("selected", action === "check-in");
    document.getElementById("outBtn").classList.toggle("selected", action === "check-out");
}

// ============================================================================
// ATTENDANCE SUBMISSION
// ============================================================================

async function submitAttendance() {
    const studentId = document.getElementById("studentId").value.trim();

    if (!studentId || !selectedAction) {
        showStatus("Enter student ID and select action", "error");
        return;
    }

    const payload = {
        roomId: scannedRoom.roomId,
        building: scannedRoom.building,
        floor: scannedRoom.floor,
        studentId: studentId,
        action: selectedAction,
        deviceId: getDeviceId(),
        deviceMetadata: getDeviceMetadata()
    };

    try {
        const response = await fetch(NODE_RED_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
            showStatus('✓ Check-in successful!', 'success');

            // Reset form
            document.getElementById("studentId").value = '';
            selectedAction = null;
            document.getElementById("inBtn").classList.remove("selected");
            document.getElementById("outBtn").classList.remove("selected");

            // Auto-hide success message after 3 seconds
            setTimeout(() => {
                document.getElementById("status").style.display = 'none';
            }, 3000);
        } else {
            showStatus(data.error || 'Check-in failed', 'error');
        }
    } catch (error) {
        showStatus('Network error. Please try again.', 'error');
        console.error('Check-in error:', error);
    }
}

// ============================================================================
// STATUS DISPLAY
// ============================================================================

function showStatus(msg, type) {
    const el = document.getElementById("status");
    el.className = "status-message " + type;
    el.textContent = msg;
}

// ============================================================================
// INITIALIZATION
// ============================================================================

window.onload = function() {
    // Display device ID
    displayDeviceId();
    
    // Log device info to console
    console.log('🔧 Device Info:', {
        deviceId: getDeviceId(),
        metadata: getDeviceMetadata()
    });
    
    // Start QR scanner
    startScanner();
};
</script>
</body>
</html>
