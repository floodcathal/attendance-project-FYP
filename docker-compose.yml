services:
  # InfluxDB
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - occupancy-net

  # Grafana
  
  grafana:
        image: grafana/grafana:10.4.1
        container_name: grafana
        ports:
          - "3000:3000"
        volumes:
          - grafana-storage:/var/lib/grafana
        environment:
          # Admin
          - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
          
          # GLOBAL USER SETTINGS (ADD THESE 3 LINES!)
          - GF_USERS_ALLOW_SIGN_UP=true
          - GF_USERS_AUTO_ASSIGN_ORG=true
          - GF_USERS_AUTO_ASSIGN_ORG_ID=2
          - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
          
          # OAuth
          - GF_AUTH_GENERIC_OAUTH_ENABLED=true
          - GF_AUTH_GENERIC_OAUTH_NAME=TU Dublin SSO
          - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
          - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=false
          - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${AZURE_CLIENT_ID}
          - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
          - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
          - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
          - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
          - GF_AUTH_GENERIC_OAUTH_API_URL=https://graph.microsoft.com/v1.0/me
          - GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS=${AZURE_ALLOWED_DOMAINS}
          - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=mail || userPrincipalName
          - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=userPrincipalName
          - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=displayName
          - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(email, 'admin') && 'Admin' || contains(email, 'lecturer') && 'Editor' || 'Viewer'
          
          # Logging
          - GF_LOG_LEVEL=debug
        networks:
          - occupancy-net
 
  # Node-RED
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: always
    ports:
      - "1880:1880"
    environment:
      - TZ=Europe/Dublin
    volumes:
      - nodered-data:/data
    networks:
      - occupancy-net

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - occupancy-net

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - occupancy-net

  scanner:
    image: nginx:alpine
    container_name: scanner
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./scanner:/usr/share/nginx/html:ro
      - ./scanner/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - occupancy-net
      
volumes:
  influxdb-data:
  influxdb-config:
  grafana-storage:
  nodered-data:
  prometheus-data:

networks:
  occupancy-net:
    driver: bridge